[package]
name = "rattler_installs_packages"
version.workspace = true
edition.workspace = true
authors = ["Bas Zalmstra <zalmstra.bas@gmail.com>", "Tim de Jager <tdejager89@gmail.com>"]
description = "Datastructures and algorithms to interact with Python packaging ecosystem"
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
include = ["src/", "vendor/", "benches/"]

[features]
default = ["native-tls"]
native-tls = ['reqwest/native-tls']
rustls-tls = ['reqwest/rustls-tls']

[dependencies]
async-trait = "0.1.91"
bytes = "1.12.1"
ciborium = "0.2.2"
csv = "1.4.0"
data-encoding = "2.11.1"
dunce = "1.0.5"
elsa = "1.11.2"
futures = "0.3.33"
html-escape = "0.2.15"
http = "1.5.0"
http-cache-semantics = { version = "2.1.1", default-features = false, features = ["serde", "reqwest"] }
include_dir = "0.7.4"
indexmap = { version = "2.14.0", features = ["serde"] }
itertools = "0.15.0"
miette = "7.6.0"
mime = "0.3.17"
once_cell = "1.21.4"
parking_lot = "0.12.5"
peg = "0.8.6"
pep440_rs = { version = "0.7.3" }
pep508_rs = { version = "0.9.2" }
pin-project-lite = "0.2.17"
rattler_digest = { version = "1.3.2", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream"] }
reqwest-middleware = "0.4.2"
serde = "1.0.229"
serde_json = "1.0.151"
serde_with = "3.21.0"
smallvec = { version = "1.15.2", features = ["const_generics", "const_new"] }
tempfile = "3.27.0"
thiserror = "2.0.19"
tl = "0.7.8"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
url = { version = "2.5.8", features = ["serde"] }
zip = "8.6.0"
resolvo = { version = "0.12.0", default-features = false, features = ["tokio"] }
pathdiff = "0.2.3"
async_zip = { version = "0.0.18", features = ["tokio", "deflate"] }
tar = "0.4.46"
flate2 = "1.1.9"
pyproject-toml = "0.13.7"
async-once-cell = "0.5.4"
configparser = "3.2.0"
cacache = { version = "13.1.0", default-features = false, features = ["tokio-runtime", "mmap"] }
async-recursion = "1.1.1"
fs-err = "3.3.1"
fs_extra = "1.3.0"
async_http_range_reader = "0.10.0"
which = "8.0.5"

[dev-dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
criterion = "0.8.2"
insta = { version = "1.48.0", features = ["ron", "redactions"] }
miette = { version = "7.6.0", features = ["fancy"] }
once_cell = "1.21.4"
rstest = "0.26.1"
test-utils = { path = "../test-utils" }
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
tokio-test = "0.4.5"
tower-http = { version = "0.7.0", features = ["add-extension"] }
tracing-test = "0.2.6"

[[bench]]
name = "html"
harness = false
