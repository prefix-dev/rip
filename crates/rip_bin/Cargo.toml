[package]
name = "rip_bin"
version.workspace = true
edition.workspace = true
authors = ["Bas Zalmstra <zalmstra.bas@gmail.com>", "Tim de Jager <tdejager89@gmail.com>"]
description = "Binary to verify and play around with rattler_installs_packages"
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
default-run = "rip"

[[bin]]
name = "rip"
path = "src/main.rs"

[features]
default = ["native-tls"]
native-tls = ['rattler_installs_packages/native-tls']
rustls-tls = ['rattler_installs_packages/rustls-tls']

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
console = { version = "0.16.4", features = ["windows-console-colors"] }
dirs = "6.0.0"
indexmap = "2.14.0"
indicatif = "0.18.6"
itertools = "0.15.0"
miette = { version = "7.6.0", features = ["fancy"] }
rattler_installs_packages = { path = "../rattler_installs_packages", default-features = false }
reqwest = { version = "0.12.28", default-features = false }
reqwest-middleware = "0.4.2"
tabwriter = { version = "1.4.1", features = ["ansi_formatting"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
rand = "0.10.2"
serde = "1.0.229"
serde_json = "1.0.151"
fs-err = "3.3.1"
clap-verbosity-flag = "3.0.4"

[package.metadata.release]
release = false
